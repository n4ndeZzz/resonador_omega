
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface-1);display:flex;flex-direction:column;align-items:center;padding:20px 12px 24px;font-family:var(--font-sans)}
.card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:22px 20px 18px;width:100%;max-width:720px}
#chart{width:100%;height:auto;display:block}
.controls{display:flex;gap:8px;justify-content:center;margin-top:14px}
.btn{padding:7px 18px;border:0.5px solid var(--border-strong);border-radius:var(--radius);font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;background:var(--surface-2);color:var(--text-primary);transition:background .12s,transform .12s,box-shadow .12s}
.btn:hover:not(:disabled){background:var(--surface-1);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-primary{background:#3ab4d8;color:#fff;border-color:#3ab4d8}
.btn-primary:hover:not(:disabled){background:#2fa0c4}
.pbar{height:2px;background:var(--border);border-radius:99px;margin-top:12px;overflow:hidden}
.pbar-fill{height:100%;width:0%;background:linear-gradient(90deg,#0d2240,#b8e9f5);border-radius:99px}
</style>

<div class="card">
  <svg id="chart" viewBox="0 0 720 510" xmlns="http://www.w3.org/2000/svg"
    role="img" aria-label="Composición atmosférica 2082 — gráfica de torta con cinco componentes"></svg>
  <div class="controls">
    <button class="btn btn-primary" id="btnPlay">▶ Reproducir</button>
    <button class="btn" id="btnPause" disabled>⏸ Pausar</button>
    <button class="btn" id="btnReset" disabled>↺ Reiniciar</button>
  </div>
  <div class="pbar"><div class="pbar-fill" id="pFill"></div></div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────
const PIE=[
  {label:'Aire convencional',    val:48, col:'#b8e9f5', tc:'#1d3f7a', ins:true},
  {label:'Hydraether suspendido',val:31, col:'#3ab4d8', tc:'#fff',    ins:true},
  {label:'Vapor de agua',        val:9,  col:'#1d3557', tc:'#fff',    ins:false},
  {label:'Partículas minerales', val:5,  col:'#8ad4e8', tc:'#333',    ins:false},
  {label:'Other',                val:7,  col:'#0d2240', tc:'#333',    ins:false},
];
// Angles (total=100, so 1 unit = 3.6°)
let cum=0;
PIE.forEach(d=>{d.sa=cum*3.6;d.sw=d.val*3.6;d.ea=d.sa+d.sw;d.ma=d.sa+d.sw/2;cum+=d.val;});

// ── CONSTANTS ─────────────────────────────────────────────────
const CX=360,CY=295,R=158,VW=720,VH=510;
const ff="'Segoe UI',-apple-system,sans-serif";
const dk=()=>document.documentElement.dataset.mode==='dark'||(!document.documentElement.dataset.mode&&matchMedia('(prefers-color-scheme:dark)').matches);
const tc =()=>dk()?'#f0efec':'#111';
const tc2=()=>dk()?'#c3c2b7':'#555';
const otc=()=>dk()?'#d0cfca':'#222'; // outside-label text color

// ── SVG HELPERS ───────────────────────────────────────────────
const NS='http://www.w3.org/2000/svg';
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);if(a)for(const[k,v]of Object.entries(a))e.setAttribute(k,v);if(p)p.appendChild(e);return e;};
const mkt=(s,a,p)=>{const e=mk('text',a,p);e.textContent=String(s);return e;};

function pxy(ang,r=R){
  const rad=(ang-90)*Math.PI/180;
  return[+(CX+r*Math.cos(rad)).toFixed(2),+(CY+r*Math.sin(rad)).toFixed(2)];
}

function slicePath(sa,ea){
  if(ea<=sa+0.02)return`M${CX},${CY}`;
  const sw=ea-sa;
  if(sw>=359.97){
    const[tx,ty]=pxy(sa),[mx,my]=pxy(sa+180);
    return`M${CX},${CY}L${tx},${ty}A${R},${R},0,0,1,${mx},${my}A${R},${R},0,0,1,${tx},${ty}Z`;
  }
  const[sx,sy]=pxy(sa),[ex,ey]=pxy(ea);
  return`M${CX},${CY}L${sx},${sy}A${R},${R},0,${sw>180?1:0},1,${ex},${ey}Z`;
}

// ── BUILD SVG ─────────────────────────────────────────────────
const svg=document.getElementById('chart');
mk('rect',{x:0,y:0,width:VW,height:VH,fill:'transparent'},svg);

// Title
const titleEl=mkt('Composición atmosférica 2082',{
  x:16,y:30,'font-size':21,'font-weight':700,
  fill:tc(),opacity:0,'font-family':ff,'letter-spacing':'-0.3'
},svg);

// Legend — 2 rows
const lgG=mk('g',{opacity:0},svg);
const LG=[
  {i:0,x:16, y:48},{i:1,x:130,y:48},{i:2,x:280,y:48},
  {i:3,x:16, y:68},{i:4,x:154,y:68},
];
LG.forEach(({i,x,y})=>{
  mk('rect',{x,y,width:12,height:12,fill:PIE[i].col,rx:2},lgG);
  mkt(PIE[i].label,{x:x+17,y:y+9.5,'font-size':9.5,fill:tc2(),'font-family':ff},lgG);
});

// ── PIE SEGMENTS + LABELS ─────────────────────────────────────
const segs=[];
PIE.forEach((d,i)=>{
  // Path (drawn above legend, below labels)
  const path=mk('path',{fill:d.col,stroke:'#fff','stroke-width':1.8,'stroke-linejoin':'round'},svg);
  path.setAttribute('d',`M${CX},${CY}`);

  // Label group
  const[lx,ly]=pxy(d.ma, d.ins ? R*0.60 : R*1.28);
  const anchor=d.ins?'middle':(lx<CX?'end':'start');
  const fill=d.ins?d.tc:otc();

  const lg=mk('g',{opacity:0},svg);
  // Short leader line for outside labels
  if(!d.ins){
    const[ax,ay]=pxy(d.ma,R+4);
    const[bx,by]=pxy(d.ma,R*1.18);
    mk('line',{x1:ax,y1:ay,x2:bx,y2:by,stroke:dk()?'#666':'#bbb','stroke-width':1},lg);
  }
  // Name
  mkt(d.label,{x:lx,y:ly,'text-anchor':anchor,'dominant-baseline':'auto',
    'font-size':10.5,'font-weight':700,fill,'font-family':ff},lg);
  // Value
  mkt(d.val,{x:lx,y:ly+15,'text-anchor':anchor,
    'font-size':13,'font-weight':700,fill,'font-family':ff},lg);

  segs.push({path,lg});
});

// Credit
mkt('Creado con Datawrapper',{x:16,y:500,'font-size':10,fill:dk()?'#555':'#bbb','font-family':ff},svg);

// ── EASING ────────────────────────────────────────────────────
const eExp  =t=>t>=1?1:1-Math.pow(2,-10*t);
const eCubic=t=>1-Math.pow(1-t,3);
const clamp =(v,a=0,b=1)=>Math.min(Math.max(v,a),b);
const pt    =(e,s,d)=>clamp((e-s)/d);

// Proportional durations: large slices sweep slower
PIE.forEach(d=>{d.dur=400+(d.sw/360)*720;});
const T0=380,STG=275;
const TOTAL=T0+(PIE.length-1)*STG+PIE[PIE.length-1].dur+350;

// ── UPDATE ────────────────────────────────────────────────────
function update(e){
  titleEl.setAttribute('opacity',eCubic(pt(e,0,320)));
  lgG.setAttribute('opacity',    eCubic(pt(e,120,300)));

  PIE.forEach((d,i)=>{
    const t=eExp(pt(e,T0+i*STG,d.dur));
    segs[i].path.setAttribute('d',slicePath(d.sa, d.sa+d.sw*t));
    segs[i].lg.setAttribute('opacity',eCubic(clamp((t-0.72)/0.28)));
  });
  document.getElementById('pFill').style.width=clamp(e/TOTAL)*100+'%';
}

// ── STATE ─────────────────────────────────────────────────────
let segStart=null,acc=0,state='idle',raf=null;
const btnPlay=document.getElementById('btnPlay');
const btnPause=document.getElementById('btnPause');
const btnReset=document.getElementById('btnReset');

function sync(){
  btnPause.disabled=state!=='playing';
  btnReset.disabled=state==='idle';
  btnPlay.disabled=state==='playing';
  btnPlay.textContent=state==='paused'?'▶ Continuar':state==='done'?'▶ Repetir':'▶ Reproducir';
}
function play(){
  segStart=performance.now();state='playing';sync();
  (function loop(){
    if(state!=='playing')return;
    const e=acc+(performance.now()-segStart);
    update(e);
    if(e>=TOTAL){update(TOTAL);state='done';sync();}
    else raf=requestAnimationFrame(loop);
  })();
}
function pause(){cancelAnimationFrame(raf);acc+=performance.now()-segStart;segStart=null;state='paused';sync();}
function reset(){
  cancelAnimationFrame(raf);acc=0;segStart=null;state='idle';
  titleEl.setAttribute('opacity',0);lgG.setAttribute('opacity',0);
  segs.forEach(s=>{s.path.setAttribute('d',`M${CX},${CY}`);s.lg.setAttribute('opacity',0);});
  document.getElementById('pFill').style.width='0%';sync();
}
btnPlay.addEventListener('click',()=>{if(state==='done')reset();play();});
btnPause.addEventListener('click',pause);
btnReset.addEventListener('click',reset);
sync();
</script>
