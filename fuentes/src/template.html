<title>Resonador Ω 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow+Semi+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Concepto: visor de documentación técnica. Fondo de estudio gris, paneles sobrios y un único acento violeta, el color del núcleo. */
:root {
  --bg1: #e7eaed; --bg2: #a6adb5; --ink: #141a20; --ink2: #46515c; --panel: rgba(247,248,250,.93); --line: #bcc4cc;
  --accent: #4a38e6; --accent-ink: #ffffff; --chip: #d6dbe0; --lead: #2b3540; --halo: #e7eaed; --nb: #141a20; --nbt: #ffffff;
  --f-ui: 'Barlow Semi Condensed', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-disp: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1: #2d353d; --bg2: #0d1116; --ink: #e8ecf0; --ink2: #a3aeb9; --panel: rgba(21,26,32,.92); --line: #39434d;
    --accent: #a597ff; --accent-ink: #0d1116; --chip: #29323b; --lead: #aab5c0; --halo: #161b21; --nb: #e8ecf0; --nbt: #0d1116; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg1: #2d353d; --bg2: #0d1116; --ink: #e8ecf0; --ink2: #a3aeb9; --panel: rgba(21,26,32,.92); --line: #39434d;
  --accent: #a597ff; --accent-ink: #0d1116; --chip: #29323b; --lead: #aab5c0; --halo: #161b21; --nb: #e8ecf0; --nbt: #0d1116; color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg2); color: var(--ink); font: 400 14px/1.45 var(--f-ui); overflow: hidden; }
#app { position: relative; height: 100%; overflow: hidden; background: radial-gradient(120% 95% at 50% 40%, var(--bg1), var(--bg2)); }
#view, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
#view canvas { display: block; touch-action: none; cursor: grab; }
#overlay { pointer-events: none; }
.lead { stroke: var(--lead); stroke-width: 1; fill: none; }
.dot { fill: var(--accent); stroke: var(--halo); stroke-width: 1.5; }
.nb { fill: var(--nb); } .nt { fill: var(--nbt); font: 600 11px var(--f-mono); } .sq { fill: var(--accent); }
.lt { fill: var(--ink); font: 500 13px var(--f-ui); paint-order: stroke; stroke: var(--halo); stroke-width: 3px; stroke-linejoin: round; }
.ring { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px; display: grid; gap: 8px; pointer-events: none; }
header > * { pointer-events: auto; }
.row1 { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 600 26px/1 var(--f-disp); letter-spacing: .16em; }
.brand p { margin: 3px 0 0; font: 500 11px/1.2 var(--f-mono); color: var(--ink2); letter-spacing: .06em; text-transform: uppercase; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tool, .tab, .seg button, #selClear, #showAll { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 6px 11px; cursor: pointer; font-weight: 500; }
.tool { color: inherit; font: inherit; text-decoration: none; display: inline-block; }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--bg1); border-color: var(--ink); }
#tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.tab { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; letter-spacing: .02em; }
.tab .n { font: 500 11px var(--f-mono); color: var(--ink2); }
.tab.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.on .n { color: inherit; opacity: .8; }

#info { position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 4; width: min(400px, calc(100% - 32px)); max-height: 46%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
#info h2 { margin: 0 0 6px; font: 600 19px/1.15 var(--f-disp); letter-spacing: .06em; text-transform: uppercase; }
#info p { margin: 0; }
.k { display: block; font: 500 10.5px var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.data { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; margin: 10px 0 0; }
.data div { border-top: 1px solid var(--line); padding-top: 4px; } .data dt { font: 500 10px var(--f-mono); text-transform: uppercase; color: var(--ink2); letter-spacing: .08em; }
.data dd { margin: 0; font: 500 17px var(--f-mono); font-variant-numeric: tabular-nums; }
.seg { display: flex; gap: 4px; margin-top: 10px; } .seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.slide { display: grid; gap: 4px; margin-top: 10px; font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); } .slide input { width: 100%; accent-color: var(--accent); }
.key { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; } .key i { display: inline-block; width: 22px; height: 10px; background: var(--ink); border: 1px solid var(--ink); vertical-align: -1px; margin-right: 8px; }
.legend { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 6px; } .legend summary { cursor: pointer; font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); }
.legend ol { margin: 6px 0 0; padding-left: 24px; display: grid; gap: 4px; } .legend li::marker { font: 500 12px var(--f-mono); color: var(--accent); } .legend li span { color: var(--ink2); display: block; font-size: 12.5px; }
.sel { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; } .sel b { display: block; font-size: 15px; } .sel p { color: var(--ink2); margin: 2px 0 8px; }

#panel { position: absolute; left: 16px; top: 112px; bottom: 16px; width: min(262px, calc(100% - 32px)); z-index: 6; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: none; flex-direction: column; overflow: hidden; }
#panel.open { display: flex; }
#panel header { position: static; padding: 10px 12px 8px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
#panel h3 { margin: 0; font: 600 14px var(--f-disp); letter-spacing: .12em; text-transform: uppercase; }
#tree { overflow: auto; padding: 6px 10px 12px; font-size: 13px; }
#tree summary { cursor: pointer; padding: 5px 0; display: flex; align-items: center; gap: 6px; font-weight: 600; } #tree summary em { margin-left: auto; font: 500 11px var(--f-mono); color: var(--ink2); font-style: normal; }
#tree ul { list-style: none; margin: 0; padding: 0 0 4px 22px; } #tree label { display: flex; gap: 7px; align-items: center; padding: 2px 0; cursor: pointer; }
#tree ul ul { padding-left: 20px; } .dot2, i.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; stroke: none; }
#tree input { accent-color: var(--accent); }
#app.pan #info { left: 294px; width: min(400px, calc(100% - 310px)); }

#inset { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 280px; z-index: 3; opacity: 0; visibility: hidden; transition: opacity .5s; transform-origin: bottom right; }
#inset.show { opacity: 1; visibility: visible; }
#insetCanvas { width: 280px; height: 280px; border-radius: 50%; border: 2px solid var(--accent); overflow: hidden; background: radial-gradient(circle at 50% 45%, rgba(122,92,255,.20), rgba(122,92,255,.04) 70%), var(--panel); }
#insetCanvas canvas { display: block; width: 280px !important; height: 280px !important; }
#inset .cap { margin-top: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; }
#inset .cap b { display: block; font: 600 13px var(--f-disp); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
#inset ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; } #inset li { display: flex; gap: 7px; align-items: center; }
#inset li i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.cota { position: absolute; z-index: 2; font: 500 12px var(--f-mono); color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 1px 6px; border-radius: 3px; transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap; }
#toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 9; background: var(--ink); color: var(--bg1); padding: 8px 14px; border-radius: 4px; font-weight: 500; max-width: calc(100% - 32px); }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 1; white-space: nowrap; font: 400 11px var(--f-mono); color: var(--ink2); text-align: right; pointer-events: none; }
@media (max-width: 820px) { #inset { transform: scale(.72); } .hint { display: none; } .brand h1 { font-size: 21px; } #app.pan #info { left: 16px; width: calc(100% - 32px); } }
@media (prefers-reduced-motion: reduce) { #inset { transition: none; } }
</style>

<div id="app">
  <div id="view"></div>
  <svg id="overlay" aria-hidden="true"></svg>
  <div class="cota" id="cotaH" hidden>12,5 m</div>
  <div class="cota" id="cotaD" hidden>Ø 9,8 m</div>
  <header>
    <div class="row1">
      <div class="brand"><h1>RESONADOR Ω</h1><p>Proyecto Ω · Instituto Kurchátov · modelo 3D modular</p></div>
      <div class="tools">
        <button class="tool" id="btnPanel" type="button" aria-pressed="false">Componentes</button>
        <button class="tool" id="btnLabels" type="button" aria-pressed="true">Etiquetas</button>
        <button class="tool" id="btnScale" type="button" aria-pressed="true">Escala</button>
        <button class="tool" id="btnPng" type="button">Guardar PNG</button>
        <!--GLB-->
      </div>
    </div>
    <nav id="tabs" aria-label="Estados del modelo"></nav>
  </header>
  <aside id="panel" aria-label="Componentes del modelo">
    <header><h3>Componentes</h3><button type="button" id="showAll">Mostrar todo</button></header>
    <div id="tree"></div>
  </aside>
  <div class="hint">Arrastra para rotar · rueda para acercar · clic en una pieza para leerla</div>
  <section id="info" aria-live="polite"></section>
  <aside id="inset" aria-label="Lupa molecular de la emulsión">
    <div id="insetCanvas"></div>
    <div class="cap"><b>Emulsión de Hydraether</b>
      <ul>
        <li><i style="background:#4aa8ff"></i>Agua (H₂O)</li>
        <li><i style="background:#e8553b"></i>Dióxido de carbono (CO₂)</li>
        <li><i style="background:#f0c14b"></i>Emulsionante: cabeza y cola</li>
      </ul>
    </div>
  </aside>
  <div id="toast" hidden role="status"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
/*MODEL*/
</script>
<script>
/*APP*/
document.getElementById('btnPanel').addEventListener('click', function () { document.getElementById('app').classList.toggle('pan'); });
</script>
